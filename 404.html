<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Betana Digital Solutions</title>
  <script>
    (function() {
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' +
        '?p=' + encodeURIComponent(l.pathname.slice(1)) +
        (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
        l.hash
      );
    })();
  </script>
</head>
<body></body>
</html>
